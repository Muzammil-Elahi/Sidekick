<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Math Tutor</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }
    .container {
      display: flex;
      height: 100vh;
    }
    .left-pane, .right-pane {
      padding: 20px;
      box-sizing: border-box;
    }
    .left-pane {
      width: 40%;
      background: #ffffff;
      border-right: 1px solid #ccc;
      overflow-y: auto;
    }
    .right-pane {
      width: 60%;
      display: flex;
      flex-direction: column;
      background: #fafafa;
    }
    h2 {
      margin-top: 0;
    }
    #chat-container {
      flex-grow: 1;
      overflow-y: auto;
      margin-bottom: 10px;
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
    }
    .message {
      margin: 10px 0;
      padding: 8px 12px;
      border-radius: 5px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .user {
      background: #d1e7dd;
      align-self: flex-end;
    }
    .assistant {
      background: #e2e3e5;
      align-self: flex-start;
    }
    #input-container {
      display: flex;
    }
    #user-input {
      flex-grow: 1;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 4px 0 0 4px;
      outline: none;
    }
    #send-button {
      padding: 10px 20px;
      border: none;
      background: #007bff;
      color: #fff;
      font-size: 1em;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
    }
    #send-button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Left Pane: Math Problem -->
    <div class="left-pane">
      <h2>Math Problem</h2>
      <p id="math-problem">Solve for <em>x</em>: 2x + 3 = 7</p>
    </div>
    <!-- Right Pane: Chat Interface -->
    <div class="right-pane">
      <h2>Chat with Your Tutor</h2>
      <div id="chat-container"></div>
      <div id="input-container">
        <input type="text" id="user-input" placeholder="Type your question..." />
        <button id="send-button">Send</button>
      </div>
    </div>
  </div>

  <script>
    // DOM Elements
    const chatContainer = document.getElementById("chat-container");
    const userInput = document.getElementById("user-input");
    const sendButton = document.getElementById("send-button");

    // Initialize conversation with a system message that instructs the tutor's behavior.
    let conversation = [
      {
        role: "system",
        content:
          "You are a friendly, conversational AI math tutor. When a student asks for help, guide them by asking leading questions or providing hints rather than giving away the full answer."
      }
    ];

    // Function to append messages to the chat container
    function appendMessage(message, sender) {
      const messageDiv = document.createElement("div");
      messageDiv.classList.add("message", sender);
      messageDiv.innerText = message;
      chatContainer.appendChild(messageDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Function to send a message to the GPT-4 API
    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      // Display the user's message
      appendMessage(message, "user");
      conversation.push({ role: "user", content: message });
      userInput.value = "";

      // Show a temporary "Typing..." message from the assistant
      const typingMessage = document.createElement("div");
      typingMessage.classList.add("message", "assistant");
      typingMessage.innerText = "Typing...";
      chatContainer.appendChild(typingMessage);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            // WARNING: Do not expose your API key in production front-end code!
            "Authorization": "API KEY HERE"
          },
          body: JSON.stringify({
            model: "gpt-4",
            messages: conversation
          })
        });

        const data = await response.json();

        // Remove the "Typing..." message
        chatContainer.removeChild(typingMessage);

        // Get the reply from the API
        const reply = data.choices[0].message.content;
        appendMessage(reply, "assistant");
        conversation.push({ role: "assistant", content: reply });
      } catch (error) {
        console.error("Error:", error);
        chatContainer.removeChild(typingMessage);
        appendMessage("Sorry, something went wrong. Please try again.", "assistant");
      }
    }

    // Event listeners for sending messages
    sendButton.addEventListener("click", sendMessage);
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
